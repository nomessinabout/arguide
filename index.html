<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Museum AR Guide - The Fox Story</title>
    <!-- Tailwind CSS for modern mobile UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- A-Frame VR/AR Library -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js for Marker-based Augmented Reality -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- A-Frame Extras for glTF Animation Mixer support -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #0b0f19;
        }
        .a-enter-vr { display: none !important; }
        
        /* Viewfinder window framing both camera feed and 3D AR scene */
        #ar-viewport {
            position: absolute;
            top: 5rem;
            bottom: 13rem;
            left: 1rem;
            right: 1rem;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: #000;
        }
        
        /* Ensure relocated AR.js video stays perfectly framed inside the rectangle */
        #ar-viewport video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            object-fit: contain !important;
            object-position: center center !important;
            z-index: 0 !important;
        }

        /* Ensure A-Frame canvas sits cleanly on top of the contained video */
        #ar-viewport .a-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
        }

        .ar-ui-overlay { pointer-events: none; }
        .ar-interactive { pointer-events: auto; }
    </style>
</head>
<body class="text-white h-screen w-screen flex flex-col justify-between select-none">

    <!-- Padded Viewfinder Container (Camera Feed + AR Scene are both constrained inside here) -->
    <div id="ar-viewport">
        <a-scene 
            embedded 
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
            renderer="colorManagement: true; logarithmicDepthBuffer: true; antialias: true; alpha: true;"
            vr-mode-ui="enabled: false">

            <!-- Asset Management -->
            <a-assets>
                <a-asset-item id="foxModel" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF-Binary/Fox.glb"></a-asset-item>
            </a-assets>

            <!-- Enhanced Lighting for PBR Textures -->
            <a-light type="ambient" color="#ffffff" intensity="2.0"></a-light>
            <a-light type="directional" color="#ffffff" intensity="1.5" position="2 4 2"></a-light>
            <a-light type="directional" color="#ffffff" intensity="0.8" position="-2 -2 -1"></a-light>

            <!-- Marker Tracking (Hiro Marker) -->
            <a-marker id="ar-marker" preset="hiro" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="5">
                <!-- 3D Animated Fox Entity -->
                <a-entity 
                    id="fox-entity"
                    gltf-model="#foxModel" 
                    scale="0.02 0.02 0.02" 
                    position="0 0 0" 
                    rotation="0 0 0"
                    animation-mixer="clip: Survey; timeScale: 1;">
                </a-entity>
            </a-marker>

            <!-- Camera Entity -->
            <a-entity camera></a-entity>
        </a-scene>
    </div>

    <!-- UI Overlay Layer -->
    <div id="ui-container" class="absolute inset-0 flex flex-col justify-between p-4 ar-ui-overlay z-50">
        
        <!-- Top Status Bar -->
        <div class="flex justify-between items-center bg-gray-900/85 backdrop-blur-md px-4 py-3 rounded-2xl border border-white/10 ar-interactive shadow-lg">
            <div class="flex items-center space-x-2.5">
                <span id="connection-indicator" class="w-3.5 h-3.5 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="status-text" class="text-xs font-semibold uppercase tracking-wider text-gray-200">Point at Hiro Marker</span>
            </div>
            <span class="text-xs text-purple-400 font-bold tracking-wide">Museum AR Guide</span>
        </div>

        <!-- Bottom Dialogue & Choice Panel -->
        <div class="space-y-3 mb-1">
            <!-- Dialogue Box -->
            <div id="dialogue-box" class="bg-gray-900/90 backdrop-blur-xl border border-white/20 rounded-2xl p-4 shadow-2xl ar-interactive transition-all duration-300 transform translate-y-10 opacity-0">
                <div class="flex items-center space-x-2 mb-1">
                    <span class="text-xs font-bold text-amber-400 uppercase tracking-widest">Guide Fox</span>
                </div>
                <p id="dialogue-text" class="text-sm md:text-base text-gray-100 leading-relaxed mb-3">
                    Looking for the marker inside the frame...
                </p>
                <!-- Dynamic Options Container -->
                <div id="options-container" class="grid grid-cols-1 gap-2">
                    <!-- Buttons injected dynamically -->
                </div>
            </div>
        </div>

    </div>

    <!-- Application Script Logic -->
    <script>
        // --- REPOSITION AR.JS WEBCAM VIDEO INTO THE VIEWPORT RECTANGLE ---
        window.addEventListener('DOMContentLoaded', () => {
            const viewport = document.getElementById('ar-viewport');
            
            // AR.js generates the video element dynamically. Observe body additions to catch and move it.
            const observer = new MutationObserver((mutations) => {
                const videoEl = document.querySelector('body > video');
                if (videoEl && videoEl.parentNode !== viewport) {
                    viewport.insertBefore(videoEl, viewport.firstChild);
                }
            });
            observer.observe(document.body, { childList: true });
        });

        // --- STORY GRAPH CONFIGURATION (Modular & Extensible) ---
        const storyGraph = {
            start: {
                text: "Hello there, traveler! Welcome to our Digital Art & History Museum. I'm your official curator guide.",
                animation: "Survey",
                timeScale: 1,
                options: [
                    { label: "Hi! Let's get started.", next: "ask_ticket" }
                ]
            },
            ask_ticket: {
                text: "Wonderful! Before we step inside the main exhibition halls, tell me: have you already purchased your entry ticket?",
                animation: "Walk",
                timeScale: 0.8,
                options: [
                    { label: "Yes, I have a ticket!", next: "ticket_yes" },
                    { label: "No, where do I buy one?", next: "ticket_no" }
                ]
            },
            ticket_yes: {
                text: "Fantastic! Please follow me closely. Head straight through that grand oak door ahead, take a sharp left down the corridor, and enjoy the gallery!",
                animation: "Run",
                timeScale: 1.2,
                options: [
                    { label: "🔄 Restart Tour Guide", next: "start" }
                ]
            },
            ticket_no: {
                text: "No worries at all! Standard adult entry is $15, students & seniors are $10, and children under 12 enter free. You can grab your ticket at the front desk kiosk just around the lobby corner.",
                animation: "Survey",
                timeScale: 1,
                options: [
                    { label: "Got it, thanks!", next: "ticket_yes" },
                    { label: "🔄 Restart Tour Guide", next: "start" }
                ]
            }
        };

        // --- APPLICATION STATE ---
        let currentSceneKey = 'start';
        let storyStarted = false;
        let markerVisible = false;

        const statusText = document.getElementById('status-text');
        const connectionIndicator = document.getElementById('connection-indicator');
        const dialogueBox = document.getElementById('dialogue-box');
        const dialogueText = document.getElementById('dialogue-text');
        const optionsContainer = document.getElementById('options-container');
        const markerEl = document.getElementById('ar-marker');
        const foxEntity = document.getElementById('fox-entity');

        // --- EVENT LISTENERS FOR MARKER TRACKING ---
        markerEl.addEventListener('markerFound', () => {
            markerVisible = true;
            connectionIndicator.className = 'w-3.5 h-3.5 rounded-full bg-emerald-500';
            statusText.textContent = 'Marker detected - Connected';
            
            if (!storyStarted) {
                storyStarted = true;
                loadScene('start');
            } else {
                dialogueBox.classList.remove('translate-y-10', 'opacity-0');
            }
        });

        markerEl.addEventListener('markerLost', () => {
            markerVisible = false;
            connectionIndicator.className = 'w-3.5 h-3.5 rounded-full bg-amber-500 animate-pulse';
            statusText.textContent = 'Marker lost - Fox holding position';
        });

        // --- STORY ENGINE CONTROLLER ---
        function loadScene(sceneKey) {
            const sceneData = storyGraph[sceneKey];
            if (!sceneData) return;

            currentSceneKey = sceneKey;

            dialogueText.style.opacity = '0';
            setTimeout(() => {
                dialogueText.textContent = sceneData.text;
                dialogueText.style.opacity = '1';
            }, 150);

            if (foxEntity) {
                foxEntity.setAttribute('animation-mixer', `clip: ${sceneData.animation}; timeScale: ${sceneData.timeScale};`);
            }

            optionsContainer.innerHTML = '';
            sceneData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full py-2.5 px-4 bg-purple-600 hover:bg-purple-500 active:bg-purple-700 text-white font-semibold text-sm rounded-xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2 ar-interactive';
                btn.textContent = opt.label;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    loadScene(opt.next);
                };
                optionsContainer.appendChild(btn);
            });

            dialogueBox.classList.remove('translate-y-10', 'opacity-0');
        }
    </script>
</body>
</html>
